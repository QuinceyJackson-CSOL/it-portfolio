name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sensitive-data scan
        run: python3 tools/sanitize_check.py .
      - name: Unit tests (mail-provider-check)
        working-directory: 03-automation-scripting/mail-provider-check
        run: python3 -m unittest -v
      - name: Unit tests (sanitizer)
        working-directory: tools
        run: python3 -m unittest -v
